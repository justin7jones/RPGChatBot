<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPG Chat</title>
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <div class="brand brand-centered">
        <img class="brand-icon" src="/assets/logo.png" alt="" width="40" height="40" />
        <span class="brand-name">RPG Chat</span>
      </div>
      <p class="login-subtitle">Enter the password to continue.</p>
      <input
        id="login-password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        autofocus
      />
      <button type="submit" class="send-button login-submit">Enter</button>
      <div id="login-error" class="login-error" hidden></div>
    </form>
  </div>

  <div class="app" id="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="/assets/logo.png" alt="RPG Chat" width="32" height="32" />
        <span class="brand-name">RPG Chat</span>
      </div>
      <div class="controls">
        <label class="campaign-label" for="campaign-select">Campaign</label>
        <select id="campaign-select" aria-label="Campaign"></select>
        <button id="reset-button" type="button" title="Start a new conversation">New conversation</button>
        <button id="logout-button" type="button" title="Log out" hidden>Log out</button>
      </div>
    </header>

    <main id="chat-log" class="chat-log" aria-live="polite">
      <div class="empty-state" id="empty-state">
        Pick a campaign above, then ask a question to get started.
      </div>
    </main>

    <form id="composer" class="composer">
      <div id="attachments" class="attachments" hidden></div>
      <div class="composer-row">
        <button id="attach-button" type="button" class="icon-button" title="Attach image(s)">&#128206;</button>
        <input id="image-input" type="file" accept="image/*" multiple hidden />
        <textarea
          id="message-input"
          placeholder="Ask about a rule, a monster, your campaign lore..."
          rows="1"
          autocomplete="off"
        ></textarea>
        <button id="send-button" type="submit" class="send-button">Send</button>
      </div>
    </form>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
