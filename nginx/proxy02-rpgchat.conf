# RPG Chat web frontend — reverse proxy config for proxy02
#
# This host (proxy02) only proxies; the actual Node app (web-server.js,
# started by pm2 as "rpg-chat-web") runs on the same Ubuntu box as the
# Discord bot. Point APP_HOST below at that box's address, reachable from
# proxy02.
#
# Install:
#   1. Replace every CHANGE_ME below.
#   2. Copy this file to /etc/nginx/sites-available/rpgchat.conf
#   3. sudo ln -s /etc/nginx/sites-available/rpgchat.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Issue a certificate, e.g.: sudo certbot --nginx -d rpgchat.CHANGE_ME.com

upstream rpgchat_web {
    # The app server's address and the WEB_PORT it's listening on
    # (WEB_PORT in .env / ecosystem.config.cjs — defaults to 3001).
    server APP_HOST:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name rpgchat.CHANGE_ME.com;

    # Redirect to HTTPS once a certificate is issued (certbot will rewrite
    # this block for you automatically if you use --nginx).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rpgchat.CHANGE_ME.com;

    ssl_certificate     /etc/letsencrypt/live/rpgchat.CHANGE_ME.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpgchat.CHANGE_ME.com/privkey.pem;

    client_max_body_size 25m; # allow room for a few attached images per message

    # Optional shared-password gate for the whole site. Uncomment both
    # lines below and create the password file first:
    #   sudo apt install apache2-utils   # provides htpasswd, if not already installed
    #   sudo htpasswd -c /etc/nginx/.htpasswd-rpgchat yourusername
    #
    # auth_basic "RPG Chat";
    # auth_basic_user_file /etc/nginx/.htpasswd-rpgchat;

    location / {
        proxy_pass http://rpgchat_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
